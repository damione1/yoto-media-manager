name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@a2627de80e5819949c7e1c83ed99b29085fc9bc4
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 scripts/generate_api.py
      - run: git diff --exit-code -- api crates/yoto-contracts crates/yoto-api-generated crates/yoto-auth-generated
