name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@a2627de80e5819949c7e1c83ed99b29085fc9bc4
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 scripts/generate_api.py
      - run: git diff --exit-code -- api crates/yoto-contracts crates/yoto-api-generated crates/yoto-auth-generated
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@a2627de80e5819949c7e1c83ed99b29085fc9bc4
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Windows build dependencies
        if: runner.os == 'Windows'
        run: choco install strawberryperl nasm -y --no-progress
      - run: python3 scripts/prepare_tools.py --target ${{ matrix.target }}
      - run: cargo fmt --all --check
      - run: cargo clippy -p yoto-domain -p yoto-infra -p yoto-desktop -p yoto-mcp --all-targets --locked --no-deps -- -D warnings -D clippy::wildcard_enum_match_arm
      - run: cargo test --workspace --locked --target ${{ matrix.target }}
        env:
          YOTO_TEST_TOOLS: ${{ github.workspace }}/tools/${{ matrix.target }}
      - run: cargo build --workspace --locked --target ${{ matrix.target }}
      - run: python3 tests/mcp_smoke.py --executable target/${{ matrix.target }}/debug/yoto-mcp --tools tools/${{ matrix.target }}
