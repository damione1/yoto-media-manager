name: Signed release
on:
  push:
    tags: ['v*']
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
env:
  YOTO_CLIENT_ID: ${{ secrets.YOTO_CLIENT_ID }}
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Derive the version from the release tag
        id: version
        run: python3 scripts/release_version.py >> "$GITHUB_OUTPUT"
      # Formatting, lints and tests ran in rust.yml on the pull request that
      # brought this commit into master; the release only builds, signs and
      # publishes. A manual rust.yml run on the commit itself also counts.
      - name: Require passing Rust checks for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/rust.yml/runs?status=success"
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.base.ref == "master" and .merged_at != null)][0].head.sha // empty')
          passed=0
          if [ -n "$head" ]; then passed=$(gh api "$runs&event=pull_request&head_sha=$head" --jq .total_count); fi
          if [ "$passed" = 0 ]; then passed=$(gh api "$runs&event=workflow_dispatch&head_sha=$GITHUB_SHA" --jq .total_count); fi
          if [ "$passed" = 0 ]; then
            echo "::error::No passing Rust checks for $GITHUB_SHA: tag a master commit merged from a pull request whose checks passed, or run rust.yml on it."
            exit 1
          fi
  apple:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      # Built into the binaries and written to the bundle, DMG and update archive.
      YOTO_APP_VERSION: ${{ needs.version.outputs.version }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Require signing and notarization credentials
        env:
          YOTO_UPDATER_PRIVATE_KEY: ${{ secrets.YOTO_UPDATER_PRIVATE_KEY }}
        shell: bash
        run: |
          for name in YOTO_UPDATER_PRIVATE_KEY YOTO_CLIENT_ID APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then echo "Missing required secret: $name"; exit 1; fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a2627de80e5819949c7e1c83ed99b29085fc9bc4
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: ${{ matrix.target }}
          save-if: false
      - id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/${{ matrix.target }}
          key: tools-${{ matrix.target }}-${{ hashFiles('distribution/**', 'scripts/prepare_tools.py', 'scripts/distribution_utils.py', 'LICENSE') }}
      - name: Import identity into temporary keychain
        shell: bash
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/yoto-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/yoto-certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/yoto-certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          xcrun notarytool store-credentials yoto-release --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --keychain "$KEYCHAIN_PATH"
          rm "$RUNNER_TEMP/yoto-certificate.p12"
      - name: Install release tools
        run: brew install minisign nasm
      - if: steps.tools.outputs.cache-hit != 'true'
        run: python3 scripts/prepare_tools.py --target ${{ matrix.target }}
      - run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      - name: Sign every sidecar, notarize, staple and validate
        run: python3 scripts/package_macos.py --target ${{ matrix.target }} --identity "$APPLE_SIGNING_IDENTITY" --notarize-profile yoto-release
      - name: Sign updater archive
        env:
          YOTO_UPDATER_PRIVATE_KEY: ${{ secrets.YOTO_UPDATER_PRIVATE_KEY }}
        run: python3 scripts/updater_release.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: YotoMediaManager-${{ matrix.target }}-signed-notarized
          path: |
            dist/${{ matrix.target }}/*.dmg
            dist/${{ matrix.target }}/*.tar.gz
            dist/${{ matrix.target }}/*.minisig
            dist/${{ matrix.target }}/*.json
      - name: Remove temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/yoto-signing.keychain-db" || true
  windows:
    needs: version
    runs-on: windows-2025
    env:
      YOTO_APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Require OAuth and updater signing configuration
        env:
          YOTO_UPDATER_PRIVATE_KEY: ${{ secrets.YOTO_UPDATER_PRIVATE_KEY }}
        shell: bash
        run: |
          for name in YOTO_CLIENT_ID YOTO_UPDATER_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then echo "Missing required secret: $name"; exit 1; fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a2627de80e5819949c7e1c83ed99b29085fc9bc4
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: x86_64-pc-windows-msvc
          save-if: false
      - id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/x86_64-pc-windows-msvc
          key: tools-x86_64-pc-windows-msvc-${{ hashFiles('distribution/**', 'scripts/prepare_tools.py', 'scripts/distribution_utils.py', 'LICENSE') }}
      - run: choco install strawberryperl nasm innosetup -y --no-progress
      # Chocolatey's minisign package stops at 0.8 (2018), which rejects the
      # updater key: it is stored unencrypted so CI can sign without a password
      # prompt, and only minisign 0.11+ reads unencrypted keys. Use the
      # official 0.12 build (the version Homebrew gives the macOS jobs), pinned
      # by checksum.
      - name: Install minisign
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'minisign-0.12-win64.zip'
          Invoke-WebRequest -Uri 'https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip' -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($hash -ne '37b600344e20c19314b2e82813db2bfdcc408b77b876f7727889dbd46d539479') { throw "minisign checksum mismatch: $hash" }
          $root = Join-Path $env:RUNNER_TEMP 'minisign'
          Expand-Archive -Path $zip -DestinationPath $root
          $bin = Join-Path $root 'minisign-win64/x86_64'
          & (Join-Path $bin 'minisign.exe') -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
      - if: steps.tools.outputs.cache-hit != 'true'
        run: python3 scripts/prepare_tools.py --target x86_64-pc-windows-msvc
      - run: cargo build --workspace --release --locked --target x86_64-pc-windows-msvc
      - name: Validate packaged sidecars
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/x86_64-pc-windows-msvc/release/tools
          Copy-Item -Recurse tools/x86_64-pc-windows-msvc/* target/x86_64-pc-windows-msvc/release/tools
          & target/x86_64-pc-windows-msvc/release/yoto-mcp.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $applicationId = (Get-Content distribution/windows-app-id.txt -Raw).Trim()
          & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' '/DAppVersion=${{ needs.version.outputs.version }}' "/DYotoAppId=$applicationId" distribution/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign updater archive
        env:
          YOTO_UPDATER_PRIVATE_KEY: ${{ secrets.YOTO_UPDATER_PRIVATE_KEY }}
        run: python3 scripts/updater_release.py --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: YotoMediaManager-Windows-x64-installer
          path: |
            dist/x86_64-pc-windows-msvc/*-setup.exe
            dist/x86_64-pc-windows-msvc/*.zip
            dist/x86_64-pc-windows-msvc/*.minisig
            dist/x86_64-pc-windows-msvc/*.json
  publish:
    needs: [version, apple, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      YOTO_APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: YotoMediaManager-*
          path: release
          merge-multiple: true
      - name: Verify and assemble update manifest
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          python3 scripts/updater_release.py --assemble release
      # The website links to releases/latest/download/<name>, so each release
      # also carries its installers under names without the version.
      - name: Copy installers under fixed names
        run: |
          cp "release/YotoMediaManager-$YOTO_APP_VERSION-aarch64-apple-darwin.dmg" release/YotoMediaManager-macOS-AppleSilicon.dmg
          cp "release/YotoMediaManager-$YOTO_APP_VERSION-x86_64-apple-darwin.dmg" release/YotoMediaManager-macOS-Intel.dmg
          cp "release/YotoMediaManager-$YOTO_APP_VERSION-x64-setup.exe" release/YotoMediaManager-Windows-setup.exe
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY" release/*.dmg release/*-setup.exe release/*.tar.gz release/*.zip release/*.minisig release/latest.json
