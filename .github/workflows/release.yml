name: Signed release
on:
  push:
    tags: ['v*']
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  YOTO_CLIENT_ID: ${{ secrets.YOTO_CLIENT_ID }}
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release tag
        id: version
        run: python3 scripts/release_version.py >> "$GITHUB_OUTPUT"
  apple:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Require signing and notarization credentials
        env:
          YOTO_UPDATER_PRIVATE_KEY: ${{ secrets.YOTO_UPDATER_PRIVATE_KEY }}
        shell: bash
        run: |
          for name in YOTO_UPDATER_PRIVATE_KEY YOTO_CLIENT_ID APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then echo "Missing required secret: $name"; exit 1; fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a2627de80e5819949c7e1c83ed99b29085fc9bc4
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Import identity into temporary keychain
        shell: bash
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/yoto-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/yoto-certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/yoto-certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          xcrun notarytool store-credentials yoto-release --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --keychain "$KEYCHAIN_PATH"
          rm "$RUNNER_TEMP/yoto-certificate.p12"
      - name: Install release tools
        run: brew install minisign nasm
      - run: python3 scripts/prepare_tools.py --target ${{ matrix.target }}
      - run: cargo fmt --all --check
      - run: cargo clippy -p yoto-domain -p yoto-infra -p yoto-desktop -p yoto-mcp -p yoto-updater --all-targets --no-deps --locked --target ${{ matrix.target }} -- -D warnings -D clippy::wildcard_enum_match_arm
      - run: cargo test --workspace --locked --target ${{ matrix.target }}
        env:
          YOTO_TEST_TOOLS: ${{ github.workspace }}/tools/${{ matrix.target }}
      - name: Validate MCP protocol with isolated debug catalogue
        run: |
          cargo build -p yoto-mcp --locked --target ${{ matrix.target }}
          python3 tests/mcp_smoke.py --executable target/${{ matrix.target }}/debug/yoto-mcp --tools tools/${{ matrix.target }}
      - run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      - name: Sign every sidecar, notarize, staple and validate
        run: python3 scripts/package_macos.py --target ${{ matrix.target }} --identity "$APPLE_SIGNING_IDENTITY" --notarize-profile yoto-release
      - name: Sign updater archive
        env:
          YOTO_UPDATER_PRIVATE_KEY: ${{ secrets.YOTO_UPDATER_PRIVATE_KEY }}
        run: python3 scripts/updater_release.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Yoto-${{ matrix.target }}-signed-notarized
          path: |
            dist/${{ matrix.target }}/*.dmg
            dist/${{ matrix.target }}/*.tar.gz
            dist/${{ matrix.target }}/*.minisig
            dist/${{ matrix.target }}/*.json
      - name: Remove temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/yoto-signing.keychain-db" || true
  windows:
    needs: version
    runs-on: windows-2025
    steps:
      - name: Require OAuth and updater signing configuration
        env:
          YOTO_UPDATER_PRIVATE_KEY: ${{ secrets.YOTO_UPDATER_PRIVATE_KEY }}
        shell: bash
        run: |
          for name in YOTO_CLIENT_ID YOTO_UPDATER_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then echo "Missing required secret: $name"; exit 1; fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a2627de80e5819949c7e1c83ed99b29085fc9bc4
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: choco install strawberryperl nasm innosetup minisign -y --no-progress
      - run: python3 scripts/prepare_tools.py --target x86_64-pc-windows-msvc
      - run: cargo fmt --all --check
      - run: cargo clippy -p yoto-domain -p yoto-infra -p yoto-desktop -p yoto-mcp -p yoto-updater --all-targets --no-deps --locked --target x86_64-pc-windows-msvc -- -D warnings -D clippy::wildcard_enum_match_arm
      - run: cargo test --workspace --locked --target x86_64-pc-windows-msvc
        env:
          YOTO_TEST_TOOLS: ${{ github.workspace }}/tools/x86_64-pc-windows-msvc
      - name: Validate MCP protocol with isolated debug catalogue
        shell: pwsh
        run: |
          cargo build -p yoto-mcp --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python3 tests/mcp_smoke.py --executable target/x86_64-pc-windows-msvc/debug/yoto-mcp.exe --tools tools/x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: cargo build --workspace --release --locked --target x86_64-pc-windows-msvc
      - name: Validate packaged sidecars
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/x86_64-pc-windows-msvc/release/tools
          Copy-Item -Recurse tools/x86_64-pc-windows-msvc/* target/x86_64-pc-windows-msvc/release/tools
          & target/x86_64-pc-windows-msvc/release/yoto-mcp.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $applicationId = (Get-Content distribution/windows-app-id.txt -Raw).Trim()
          & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' '/DAppVersion=${{ needs.version.outputs.version }}' "/DYotoAppId=$applicationId" distribution/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign updater archive
        env:
          YOTO_UPDATER_PRIVATE_KEY: ${{ secrets.YOTO_UPDATER_PRIVATE_KEY }}
        run: python3 scripts/updater_release.py --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Yoto-Windows-x64-installer
          path: |
            dist/x86_64-pc-windows-msvc/*-setup.exe
            dist/x86_64-pc-windows-msvc/*.zip
            dist/x86_64-pc-windows-msvc/*.minisig
            dist/x86_64-pc-windows-msvc/*.json
  publish:
    needs: [version, apple, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Yoto-*
          path: release
          merge-multiple: true
      - name: Verify and assemble update manifest
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          python3 scripts/updater_release.py --assemble release
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY" release/*.dmg release/*-setup.exe release/*.tar.gz release/*.zip release/*.minisig release/latest.json
