name: Rust
# Formatting, lints, tests and the MCP smoke test on every platform we ship.
# Work happens on develop; these checks run on pull requests into master, and
# a release only builds and signs a master commit whose pull request passed
# here (see release.yml).
#
# Caches written by master are the only ones every pull request and release
# tag can read, so after each merge `warm` compiles (without testing) what the
# checks and the release build need, and saves it.
#
# Changes that only touch the website or documentation skip all of it. Branch
# protection requires the single `Rust checks` job, which passes when every
# job either passed or was skipped for that reason.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  YOTO_CLIENT_ID: ${{ secrets.YOTO_CLIENT_ID }}
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Anything outside the website and documentation counts as the app; a
          # manual run, or a base we cannot compare with, checks everything.
          app=true
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qvE '^site/|\.md$|^assets/social/|^\.github/workflows/site\.yml$'; then
              app=false
            fi
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "App changes: $app"
  fmt:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a2627de80e5819949c7e1c83ed99b29085fc9bc4
        with:
          components: rustfmt
      - run: cargo fmt --all --check
  checks:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a2627de80e5819949c7e1c83ed99b29085fc9bc4
        with:
          targets: ${{ matrix.target }}
          components: clippy
      # Starts from master's cache; also saved for this pull request, even
      # when a check fails, so the fix pushed next rebuilds only what changed.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: ${{ matrix.target }}
          cache-on-failure: true
      # The sidecars (FFmpeg is compiled on macOS) only change with their pins.
      - id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/${{ matrix.target }}
          key: tools-${{ matrix.target }}-${{ hashFiles('distribution/**', 'scripts/prepare_tools.py', 'scripts/distribution_utils.py', 'LICENSE') }}
      # nasm builds FFmpeg and aws-lc; Strawberry Perl builds aws-lc on Windows.
      - if: runner.os == 'macOS'
        run: brew install nasm
      - if: runner.os == 'Windows'
        run: choco install strawberryperl nasm -y --no-progress
      - if: steps.tools.outputs.cache-hit != 'true'
        run: python3 scripts/prepare_tools.py --target ${{ matrix.target }}
      - run: cargo clippy -p yoto-domain -p yoto-infra -p yoto-desktop -p yoto-mcp -p yoto-updater --all-targets --no-deps --locked --target ${{ matrix.target }} -- -D warnings -D clippy::wildcard_enum_match_arm
      - run: cargo test --workspace --locked --target ${{ matrix.target }}
        env:
          YOTO_TEST_TOOLS: ${{ github.workspace }}/tools/${{ matrix.target }}
      - name: Validate MCP protocol with isolated debug catalogue
        shell: bash
        run: |
          cargo build -p yoto-mcp --locked --target ${{ matrix.target }}
          python3 tests/mcp_smoke.py --executable target/${{ matrix.target }}/debug/yoto-mcp${{ runner.os == 'Windows' && '.exe' || '' }} --tools tools/${{ matrix.target }}
  # The check branch protection requires: a skipped job is fine, a failed or
  # cancelled one is not.
  result:
    name: Rust checks
    needs: [changes, fmt, checks]
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
  warm:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a2627de80e5819949c7e1c83ed99b29085fc9bc4
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: ${{ matrix.target }}
      - id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/${{ matrix.target }}
          key: tools-${{ matrix.target }}-${{ hashFiles('distribution/**', 'scripts/prepare_tools.py', 'scripts/distribution_utils.py', 'LICENSE') }}
      - if: runner.os == 'macOS'
        run: brew install nasm
      - if: runner.os == 'Windows'
        run: choco install strawberryperl nasm -y --no-progress
      - if: steps.tools.outputs.cache-hit != 'true'
        run: python3 scripts/prepare_tools.py --target ${{ matrix.target }}
      - run: cargo clippy -p yoto-domain -p yoto-infra -p yoto-desktop -p yoto-mcp -p yoto-updater --all-targets --no-deps --locked --target ${{ matrix.target }}
      - run: cargo test --workspace --locked --target ${{ matrix.target }} --no-run
      - run: cargo build --workspace --release --locked --target ${{ matrix.target }}
