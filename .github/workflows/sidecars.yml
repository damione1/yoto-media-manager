name: Sidecars
# Prepares the bundled tools (FFmpeg is compiled on macOS) and caches them on
# master, where pull requests into master and release tags can read them. It
# only runs when their pins or preparation scripts change.
on:
  push:
    branches: [master]
    paths:
      - 'distribution/**'
      - 'scripts/prepare_tools.py'
      - 'scripts/distribution_utils.py'
      - 'LICENSE'
      - '.github/workflows/sidecars.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/${{ matrix.target }}
          key: tools-${{ matrix.target }}-${{ hashFiles('distribution/**', 'scripts/prepare_tools.py', 'scripts/distribution_utils.py', 'LICENSE') }}
      - if: steps.tools.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: brew install nasm
      - if: steps.tools.outputs.cache-hit != 'true'
        run: python3 scripts/prepare_tools.py --target ${{ matrix.target }}
