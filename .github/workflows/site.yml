name: Site

# Checks that the public website (site/, Eleventy) still builds. Cloudflare
# Workers Builds watches master and builds and publishes the site itself
# (root directory site/, SITE_URL as a build variable), so this workflow only
# guards pull requests. A completed release triggers a fresh production build
# so installer URLs and measured versions advance together.
on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_run:
    workflows: [Signed release]
    types: [completed]
  workflow_dispatch:
    inputs:
      redeploy:
        description: Refresh the published installers and deploy the website
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build and validate SEO and Worker behavior
        working-directory: site
        run: |
          npm ci --ignore-scripts
          npm test

      # A build that silently produced nothing would pass unnoticed.
      - name: Check the build produced a page
        run: test -s site/_site/index.html

  refresh-downloads:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && inputs.redeploy)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rebuild the website with the published installers
        env:
          DEPLOY_HOOK_URL: ${{ secrets.SITE_DEPLOY_HOOK_URL }}
        run: |
          test -n "$DEPLOY_HOOK_URL"
          curl --silent --show-error --fail --request POST "$DEPLOY_HOOK_URL" --output /dev/null
