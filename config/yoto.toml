# OAuth settings. The client ID is injected at build time via YOTO_CLIENT_ID.
[oauth]
redirect_uri = "http://127.0.0.1:8787/callback"
requested_scopes = [
    "family:library:view",
    "family:library:manage",
    "user:content:view",
    "user:content:manage",
    "user:icons:manage",
    "family:devices:view",
    "family:devices:manage",
    "family:devices:control",
    "offline_access",
]
