[package]
name = "yoto-infra"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
yoto-domain = { path = "../yoto-domain" }
yoto-updater = { path = "../yoto-updater" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
sha2.workspace = true
hex.workspace = true
tokio.workspace = true
reqwest.workspace = true
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }
chacha20poly1305 = { version = "0.10", features = ["stream"] }
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
directories = "6"
fs2 = "0.4"
base64 = "0.22"
url = "2"
httpdate = "1"
webbrowser = "1"
toml = "0.9"
tokio-util = { version = "0.7", features = ["io"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
yoto-api-generated = { path = "../yoto-api-generated" }
yoto-auth-generated = { path = "../yoto-auth-generated" }
tempfile = "3"
rumqttc = { version = "=0.25.1", features = ["websocket", "url"] }
libc = "0.2"
schemars = "1"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSString", "NSURL"] }
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVAudioPlayer"] }
[target.'cfg(not(target_os = "macos"))'.dependencies]
rodio = { version = "=0.23.0", default-features = false, features = ["playback", "wav"] }
[dev-dependencies]
rodio = { version = "=0.23.0", default-features = false, features = ["wav"] }
tempfile = "3"
wiremock = "0.6"
